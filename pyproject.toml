[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ronin-mini"
version = "0.5.0"
description = "Minimal, model-agnostic AI pentesting harness (recon -> exploit -> verify)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai",
    "requests",
    "dnspython",
    "mcp",
    "pyyaml",
    "pymongo",
]

[tool.setuptools.packages.find]
include = ["ronin_mini*"]

[tool.setuptools.package-data]
ronin_mini = ["agents/*.md", "skills/*.md", "ronin-tools-mcp/**/*"]
